name: Publish ixaistudio site

on:
  push:
    branches:
      - main
    paths:
      - "ixai/frontend/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site root
        shell: bash
        run: |
          mkdir -p _site/assets _site/terms _site/privacy _site/youth
          cp ixai/frontend/index.html _site/index.html
          cp ixai/frontend/styles.css _site/assets/styles.css
          cp ixai/frontend/experience.css _site/assets/experience.css
          cp ixai/frontend/app.js _site/assets/app.js
          cp ixai/frontend/ixaistudio-logo.svg _site/assets/ixaistudio-logo.svg
          cp ixai/frontend/terms.html _site/terms/index.html
          cp ixai/frontend/privacy.html _site/privacy/index.html
          cp ixai/frontend/youth.html _site/youth/index.html
          cp CNAME _site/CNAME
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
