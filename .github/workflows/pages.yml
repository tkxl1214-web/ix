name: Sync ixaistudio frontend to Pages root

on:
  push:
    branches:
      - main
    paths:
      - "ixai/frontend/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Copy site files to GitHub Pages root
        shell: bash
        run: |
          mkdir -p assets terms privacy youth
          cp ixai/frontend/index.html index.html
          cp ixai/frontend/styles.css assets/styles.css
          cp ixai/frontend/experience.css assets/experience.css
          cp ixai/frontend/app.js assets/app.js
          cp ixai/frontend/ixaistudio-logo.svg assets/ixaistudio-logo.svg
          cp ixai/frontend/terms.html terms/index.html
          cp ixai/frontend/privacy.html privacy/index.html
          cp ixai/frontend/youth.html youth/index.html
          touch .nojekyll
      - name: Commit synchronized site files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ terms/ privacy/ youth/ .nojekyll
          if git diff --cached --quiet; then
            echo "No frontend changes to publish."
            exit 0
          fi
          git commit -m "Publish ixaistudio frontend to Pages root"
          git push
